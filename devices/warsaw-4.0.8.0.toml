[device]
codename = "warsaw"
brand = "Redmi"
model = "REDMI K90 Ultra"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"
# The phone asks for its screen lock before anything else: nothing but
# decrypting and rebooting is reachable until the data partition is open.
unlock_first = true

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# the p12x panel's own mode in the device tree.
width = 1280
height = 2772
density = 480

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Goodix's, over SPI behind Xiaomi's touch layer, the one
# touch driver the phone's own modules.load lists.
load = ["goodix_core"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's Goodix one.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one kiwi driver the phone's own modules.blocklist leaves of those its
# modules.load lists; the Peach, WCN7750 and QCA6750 drivers it lists as
# well are for chips the device tree has no node of. Its cfg80211 asks for
# rfkill, one of the kernel's own modules in system_dlkm, as the 17
# Ultra's does. Its recovery covers the vendor partition's firmware folder
# with the modem's, as the 13 Ultra's does, so the settings and the MAC
# address are given to the loader again: the settings from the vendor
# partition, the address from where the vendor's link points in persist.
# wpa_supplicant runs on the recovery's own libraries before the vendor
# partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    # The phone keeps no wlan_mac.bin: there is none under /persist, /vendor or
    # the modem partition, and its persist/wlan folder is empty, so the MAC the
    # driver uses is not one a firmware file carries here.
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
]

interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# What the secure element needs before its services can run: the runtime
# APEX's libdl_android (the recovery carries none), the linker namespaces
# that reach /odm and /vendor, persist at /persist as well, and the NFC
# driver node owned as the phone's own ueventd would own it.
[[service]]
path = "/vendor/bin/sh"
args = ["-c", "mkdir -p /tmp/rt /mnt/apex_rt; unzip -o -q /mnt/system/system/apex/com.android.runtime.apex apex_payload.img -d /tmp/rt; mount -t erofs -o loop,ro /tmp/rt/apex_payload.img /mnt/apex_rt; cp -f /mnt/apex_rt/lib64/bionic/libdl_android.so /system/lib64/; cp -f /mnt/system/system/lib64/libvndksupport.so /system/lib64/; cp -f /vendor/lib64/hw/libEseUtils.so /system/lib64/; rm -f /system/etc/ld.config.txt; echo 'dir.recovery = /system/bin' >> /system/etc/ld.config.txt; echo 'dir.odm = /odm/bin' >> /system/etc/ld.config.txt; echo 'dir.vendor = /vendor/bin' >> /system/etc/ld.config.txt; echo '[recovery]' >> /system/etc/ld.config.txt; echo 'namespace.default.isolated = false' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths = /system/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths = /system/lib64' >> /system/etc/ld.config.txt; echo '[odm]' >> /system/etc/ld.config.txt; echo 'namespace.default.isolated = false' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths = /odm/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /vendor/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /system/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /vendor/lib64/hw' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /mnt/system/system/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths = /odm/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /vendor/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /system/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /vendor/lib64/hw' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /mnt/system/system/lib64' >> /system/etc/ld.config.txt; echo '[vendor]' >> /system/etc/ld.config.txt; echo 'namespace.default.isolated = false' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths = /vendor/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /vendor/lib64/hw' >> /system/etc/ld.config.txt; echo 'namespace.default.search.paths += /system/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths = /vendor/lib64' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /vendor/lib64/hw' >> /system/etc/ld.config.txt; echo 'namespace.default.permitted.paths += /system/lib64' >> /system/etc/ld.config.txt; mkdir -p /persist; mount -o bind /mnt/vendor/persist /persist; chown system:drmrpc /dev/smcinvoke /dev/qsee_ipc_irq_spss; chmod 0660 /dev/smcinvoke /dev/qsee_ipc_irq_spss; insmod /vendor_dlkm/lib/modules/nxp-nci.ko; chown system:nfc /dev/nq-nci; chmod 0666 /dev/nq-nci"]
oneshot = true
user = "root"
groups = ["root", "system"]

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN's MAC address is there, and so
# is what the secure world's programs keep: without it qseecomd, keymint and
# gatekeeper answer nothing, and the data partition cannot be opened.
[partitions]
mounted = ["persist"]

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS4.0.8.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.8.0.XHPCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.8.0.XHPCNXM/warsaw-ota_full-OS4.0.8.0.XHPCNXM-user-17.0-96194cf12c.zip"
recovery = "600a181d79c95d7155b9241fae15263586af7b527da2e6403c56f1d9834217d3"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
